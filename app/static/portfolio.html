<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Display:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: white; overflow: hidden; }
    @keyframes springIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .spring-in { animation: springIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @media (max-width: 640px) {
      body { overflow: auto; }
      #root > div { min-height: 100dvh; height: 100dvh !important; overflow: hidden auto !important; }
      .portfolio-project { left: auto !important; top: auto !important; position: relative !important; transform: none !important; width: 100%; padding: 12px; display: flex; flex-direction: row; justify-content: flex-start; gap: 12px !important; z-index: 2 !important; }
      .portfolio-project > div:first-child { padding: 6px !important; }
      .portfolio-project img { width: min(100%, 320px) !important; aspect-ratio: 4 / 3; object-fit: cover; }
      .portfolio-project > div:last-child span { color: #fff !important; font-size: 14px !important; }
      #root > div > .portfolio-project > div:last-child { align-self: center; }
      #root > div > div[style*="bottom: 0px"] { display: none; }
      #root > div > div[style*="bottom: 64px"] { position: fixed !important; bottom: max(14px, env(safe-area-inset-bottom)) !important; gap: 10px !important; padding: 9px !important; max-width: calc(100vw - 24px); }
      #root > div > div[style*="bottom: 64px"] img { width: 40px !important; height: 40px !important; }
      #root > div > div[style*="bottom: 64px"] > div[style*="width: 1px"] { height: 36px !important; }
      #root > div > div[style*="z-index: 50"] > div { width: calc(100vw - 28px) !important; max-height: 78dvh !important; border-radius: 18px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-type="module">
    const { useState, useRef, useCallback, useEffect } = React;

    // ─── Data ───────────────────────────────────────────────────────────────────
    const projects = [
      { id: 1, title: "La ou dort l'eau", anchorX: 42.75, anchorY: 48.5, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260606_153138_ef8b2e9b-3d18-4b75-8df7-5bc6f0f84fca.png&w=1920&q=85" },
      { id: 2, title: "Champ Silencieux", anchorX: 26, anchorY: 29.5, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_092743_5be19a2a-e188-4bca-9ed6-74049aa3d83b.png&w=1920&q=85" },
      { id: 3, title: "Lisiere", anchorX: 23.33, anchorY: 60.88, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260530_012333_aca09e65-227f-4185-a25f-85191cfac44d.png&w=1920&q=85" },
      { id: 4, title: "Elan Brut", anchorX: 68, anchorY: 62.13, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260527_084631_63ecf071-0fd9-42e3-989a-144728ce8ddb.png&w=1920&q=85" },
      { id: 5, title: "Les Silences Miroirs", anchorX: 66.08, anchorY: 19.63, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260525_053312_b4d2b145-7bb2-4755-b7a0-79a8e81b1265.png&w=1920&q=85" },
      { id: 6, title: "Revolte douce", anchorX: 73.92, anchorY: 40.75, thumbnail: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260512_012043_9764f2d0-5c6e-4faa-94a6-a8253df08c5e.png&w=1920&q=85" },
    ];

    // ─── useDraggable Hook ──────────────────────────────────────────────────────
    function useDraggable() {
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const dragRef = useRef({ dragging: false, sx: 0, sy: 0, ox: 0, oy: 0, cx: 0, cy: 0 });
      const isDraggingRef = useRef(false);

      const onMouseDown = useCallback((e) => {
        e.preventDefault();
        const state = dragRef.current;
        state.dragging = true;
        state.sx = e.clientX;
        state.sy = e.clientY;
        state.ox = state.cx;
        state.oy = state.cy;
        isDraggingRef.current = false;

        const onMove = (ev) => {
          const dx = ev.clientX - state.sx;
          const dy = ev.clientY - state.sy;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            isDraggingRef.current = true;
          }
          state.cx = state.ox + dx;
          state.cy = state.oy + dy;
          setPos({ x: state.cx, y: state.cy });
        };

        const onUp = () => {
          state.dragging = false;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      }, []);

      return { pos, onMouseDown, isDraggingRef };
    }

    // ─── ProjectCard ────────────────────────────────────────────────────────────
    function ProjectCard({ title, thumbnail, anchorX, anchorY, onClick }) {
      const { pos, onMouseDown, isDraggingRef } = useDraggable();
      const [hovered, setHovered] = useState(false);

      const handleClick = () => {
        if (!isDraggingRef.current) onClick();
      };

      return (
        <div
          className="portfolio-project"
          style={{
            position: 'absolute',
            left: `calc(${anchorX}% - 52px)`,
            top: `calc(${anchorY}% - 64px)`,
            transform: `translate(${pos.x}px, ${pos.y}px)`,
            zIndex: 2,
            cursor: 'pointer',
            userSelect: 'none',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            gap: '8px',
          }}
          onMouseDown={onMouseDown}
          onMouseUp={handleClick}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div
            style={{
              padding: '12px',
              borderRadius: '8px',
              border: hovered ? '2px solid rgba(255,255,255,0.2)' : '2px solid transparent',
              background: hovered ? 'rgba(0,0,0,0.16)' : 'transparent',
              transition: 'background 0.18s ease, border-color 0.18s ease',
            }}
          >
            <img
              src={thumbnail}
              alt={title}
              draggable={false}
              style={{
                width: '80px',
                height: 'auto',
                borderRadius: '8px',
                border: '1px solid rgba(255,255,255,0.2)',
                boxShadow: '0px 1px 6px 0px rgba(0,0,0,0.08)',
                display: 'block',
              }}
            />
          </div>
          <div
            style={{
              background: hovered ? 'rgb(0,102,221)' : 'transparent',
              padding: hovered ? '4px 8px' : '4px 0',
              borderRadius: '4px',
              transition: 'background 0.18s ease, padding 0.18s ease',
            }}
          >
            <span
              style={{
                fontFamily: "'Inter', sans-serif",
                fontWeight: 400,
                fontSize: '16px',
                lineHeight: '1.4em',
                letterSpacing: '-0.04em',
                color: 'rgb(247,247,247)',
                whiteSpace: 'nowrap',
              }}
            >
              {title}
            </span>
          </div>
        </div>
      );
    }

    // ─── DockIcon ───────────────────────────────────────────────────────────────
    function DockIcon({ label, iconUrl, onClick, href }) {
      const [hovered, setHovered] = useState(false);

      const content = (
        <div
          style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center' }}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          {hovered && (
            <div
              style={{
                position: 'absolute',
                bottom: 'calc(100% + 12px)',
                left: '50%',
                transform: 'translateX(-50%)',
                opacity: 1,
                transition: 'opacity 0.15s ease',
                pointerEvents: 'none',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
              }}
            >
              <div
                style={{
                  padding: '6px 12px',
                  borderRadius: '64px',
                  background: 'white',
                  boxShadow: '0 4px 16px rgba(0,0,0,0.12)',
                  whiteSpace: 'nowrap',
                }}
              >
                <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 500, fontSize: '12px', letterSpacing: '-0.04em', color: 'black' }}>
                  {label}
                </span>
              </div>
              <div style={{ width: 0, height: 0, borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderTop: '8px solid white' }} />
            </div>
          )}
          <div
            style={{
              width: '48px',
              height: '48px',
              borderRadius: '28%',
              overflow: 'hidden',
              transform: hovered ? 'scale(1.12)' : 'scale(1)',
              transition: 'transform 0.2s cubic-bezier(0.34,1.56,0.64,1)',
            }}
          >
            <img src={iconUrl} alt={label} draggable={false} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          </div>
        </div>
      );

      if (href) {
        return <a href={href} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>{content}</a>;
      }
      return <div onClick={onClick} style={{ cursor: 'pointer' }}>{content}</div>;
    }

    // ─── DockBar ────────────────────────────────────────────────────────────────
    function DockBar({ onAbout, onNotes }) {
      return (
        <div
          style={{
            position: 'absolute',
            bottom: '64px',
            left: '50%',
            transform: 'translateX(-50%)',
            zIndex: 4,
            display: 'flex',
            flexDirection: 'row',
            alignItems: 'center',
            gap: '16px',
            padding: '12px',
            borderRadius: '24px',
            background: 'rgba(255,255,255,0.1)',
            border: '1px solid rgba(255,255,255,0.2)',
            backdropFilter: 'blur(5px)',
            WebkitBackdropFilter: 'blur(5px)',
          }}
        >
          <DockIcon label="About Me" iconUrl="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_151824_5f47765e-d133-4a38-b8bc-d968a07881a3.png&w=1920&q=85" onClick={onAbout} />
          <DockIcon label="Notes" iconUrl="https://framerusercontent.com/images/4ar8CL6aUtjymV8jTsXrcPzXCM.svg" onClick={onNotes} />
          <div style={{ width: '1px', height: '48px', background: 'rgba(255,255,255,0.2)', borderRadius: '64px' }} />
          <DockIcon label="Instagram" iconUrl="https://framerusercontent.com/images/Q0Z0p8LOZhN2hJ2arLjEtkqQD0.png" href="https://www.instagram.com/" />
          <DockIcon label="X" iconUrl="https://framerusercontent.com/images/vjmmhizcqEgw5ZT5SNFQMpxD00.png" href="https://www.x.com/" />
          <DockIcon label="Behance" iconUrl="https://framerusercontent.com/images/edJkRGfjqjPajyxmEgsUCKVgjE.png" href="https://www.behance.com/" />
        </div>
      );
    }

    // ─── WindowShell ────────────────────────────────────────────────────────────
    function WindowShell({ title, onClose, wide, children }) {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => setVisible(true));
        });
      }, []);

      return (
        <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50, pointerEvents: 'none' }}>
          <div
            style={{
              width: wide ? '70vw' : '60vw',
              maxWidth: wide ? '840px' : '720px',
              maxHeight: '70vh',
              borderRadius: '24px',
              background: 'white',
              boxShadow: '0 32px 80px rgba(0,0,0,0.28)',
              pointerEvents: 'all',
              display: 'flex',
              flexDirection: 'column',
              overflow: 'hidden',
              transform: visible ? 'scale(1)' : 'scale(0.8)',
              opacity: visible ? 1 : 0,
              transition: 'transform 0.4s cubic-bezier(0.34,1.28,0.64,1), opacity 0.3s ease',
            }}
          >
            <div style={{ height: '40px', padding: '0 16px', borderBottom: '1px solid rgb(229,229,234)', display: 'flex', alignItems: 'center', gap: '8px', cursor: 'grab', flexShrink: 0 }}>
              <div style={{ display: 'flex', gap: '8px' }}>
                <div onClick={onClose} style={{ width: '12px', height: '12px', borderRadius: '50%', background: 'rgb(253,93,92)', cursor: 'pointer' }} />
                <div onClick={onClose} style={{ width: '12px', height: '12px', borderRadius: '50%', background: 'rgb(250,201,0)', cursor: 'pointer' }} />
                <div onClick={onClose} style={{ width: '12px', height: '12px', borderRadius: '50%', background: 'rgb(52,199,90)', cursor: 'pointer' }} />
              </div>
              <div style={{ flex: 1, textAlign: 'center' }}>
                <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: 400, fontSize: '16px', color: 'rgb(134,134,139)', letterSpacing: '-0.04em' }}>
                  {title}
                </span>
              </div>
              <div style={{ width: '52px' }} />
            </div>
            <div style={{ flex: 1, overflowY: 'auto', padding: '16px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {children}
            </div>
          </div>
        </div>
      );
    }

    // ─── App ────────────────────────────────────────────────────────────────────
    function App() {
      const [overlay, setOverlay] = useState(null);

      return (
        <div style={{ width: '100%', height: '100vh', overflow: 'hidden', position: 'relative', background: 'white' }}>
          {/* Background image */}
          <div
            style={{
              position: 'absolute',
              inset: 0,
              backgroundImage: 'url(https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_151236_784929aa-a992-4292-9938-1dd9b5296a29.png&w=1920&q=85)',
              backgroundSize: 'cover',
              backgroundPosition: 'center',
            }}
          />

          {/* Gradient overlay */}
          <div
            style={{
              position: 'absolute',
              inset: 0,
              background: 'linear-gradient(180deg, rgba(84,84,84,0) 0%, rgb(0,0,0) 100%)',
              opacity: 0.4,
            }}
          />

          {/* Bottom blur layer */}
          <div
            style={{
              position: 'absolute',
              bottom: 0,
              left: '50%',
              transform: 'translateX(-50%)',
              width: '100%',
              height: '47.375%',
              backdropFilter: 'blur(10px)',
              WebkitBackdropFilter: 'blur(10px)',
              maskImage: 'linear-gradient(to bottom, transparent 0%, black 40%)',
              WebkitMaskImage: 'linear-gradient(to bottom, transparent 0%, black 40%)',
              zIndex: 1,
              pointerEvents: 'none',
            }}
          />

          {/* Project cards */}
          {projects.map((p) => (
            <ProjectCard
              key={p.id}
              title={p.title}
              thumbnail={p.thumbnail}
              anchorX={p.anchorX}
              anchorY={p.anchorY}
              onClick={() => setOverlay({ project: p })}
            />
          ))}

          {/* Dock bar */}
          <DockBar onAbout={() => setOverlay('about')} onNotes={() => setOverlay('notes')} />

          {/* Overlays */}
          {overlay === 'about' && (
            <WindowShell title="About Me" onClose={() => setOverlay(null)}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', padding: '8px' }}>
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '15px', lineHeight: '1.6', color: '#333', margin: 0 }}>
                  I am a photographer driven by the interplay of light, texture, and stillness.
                  My work explores quiet landscapes, forgotten places, and the poetry found in ordinary scenes.
                </p>
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '15px', lineHeight: '1.6', color: '#333', margin: 0 }}>
                  Based in France, I spend my time wandering through fields, forests, and coastal edges,
                  looking for moments where nature speaks in whispers.
                </p>
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '15px', lineHeight: '1.6', color: '#666', margin: 0, fontStyle: 'italic' }}>
                  Available for collaborations, exhibitions, and editorial work.
                </p>
              </div>
            </WindowShell>
          )}

          {overlay === 'notes' && (
            <WindowShell title="Notes" onClose={() => setOverlay(null)} wide={true}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', padding: '8px' }}>
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '15px', lineHeight: '1.6', color: '#333', margin: 0 }}>
                  Each project begins with a feeling -- a quality of light, an atmosphere, a silence that asks to be seen.
                  I don't plan my shots. I arrive, I wait, I listen with my eyes.
                </p>
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '15px', lineHeight: '1.6', color: '#333', margin: 0 }}>
                  I shoot primarily on medium format film and occasionally digital when the project demands speed.
                  Post-processing is minimal -- I prefer the grain and warmth of what the lens captured.
                </p>
              </div>
            </WindowShell>
          )}

          {overlay && typeof overlay === 'object' && overlay.project && (
            <WindowShell title={overlay.project.title} onClose={() => setOverlay(null)} wide={true}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', alignItems: 'center' }}>
                <img
                  src={overlay.project.thumbnail}
                  alt={overlay.project.title}
                  style={{ width: '100%', maxHeight: '50vh', objectFit: 'contain', borderRadius: '8px' }}
                />
                <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '14px', color: '#666', textAlign: 'center', margin: 0 }}>
                  {overlay.project.title}
                </p>
              </div>
            </WindowShell>
          )}
        </div>
      );
    }

    // ─── Mount ──────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
